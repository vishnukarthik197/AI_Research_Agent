
services:
  backend:
    build: .
    container_name: ai-research-backend
    command: python -m uvicorn app.api.routes:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: .
    container_name: ai-research-frontend
    command: streamlit run app/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
